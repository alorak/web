<!doctype html>

<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <div class="site-shell">

          <span class="brand-wordmark" aria-hidden="true">ALORAK<span class="brand-wordmark-dot">.</span></span>
        </a>
        <div class="header-actions">
          <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
            <a href="#/oyun" data-route="oyun" data-i18n="navGames">Games</a>
            <a href="#/araclar" data-route="araclar" data-i18n="navTools">Tools</a>

        <p data-i18n="footer">Made with curiosity. Built to be shared.</p>
        <a href="https://github.com/alorak" target="_blank" rel="noopener noreferrer" aria-label="ALORAK GitHub profile (opens in a new tab)">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </div>

  <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Close dialog">×</button>
